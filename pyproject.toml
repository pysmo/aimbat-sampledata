[project]
name = "aimbat-sampledata"
version = "0.1.0"
description = "Fetch script and provenance for pysmo/AIMBAT's example seismic dataset"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pysmo",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pandas-stubs>=2.0",
    "pytest>=8.4.2",
    "ruff>=0.13.0",
]

[tool.uv]
package = false

[tool.uv.sources]
pysmo = { git = "https://github.com/pysmo/pysmo", rev = "ddc1379f8fac4f7a17d1fe45851d085873f63361" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
extend-exclude = ["Event_*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "pysmo-group",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"pysmo-group" = ["pysmo"]
