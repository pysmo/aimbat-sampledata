[project]
name = "data-example"
version = "0.1.0"
description = "Fetch script and provenance for pysmo/AIMBAT's example seismic dataset"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pysmo",
    "pandas>=2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
pysmo = { path = "../pysmo", editable = true }
