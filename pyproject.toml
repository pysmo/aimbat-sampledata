[project]
name = "aimbat-sampledata"
version = "0.1.0"
description = "Fetch script and provenance for pysmo/AIMBAT's example seismic dataset"
requires-python = ">=3.13,<3.16"
dependencies = [
    "pysmo",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pandas-stubs>=2.0",
    "pytest>=8.4.2",
    "ruff>=0.13.0",
]
# Only fetch_events.py uses ObsPy (TauP travel times for pP), and only when
# regenerating the dataset.
fetch = ["obspy>=1.4"]

[tool.uv]
package = false

[tool.uv.sources]
pysmo = { git = "https://github.com/pysmo/pysmo", rev = "225a384226bb014039c9731036014e8d67259fa3" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Only in the `fetch` group, and untyped.
module = ["obspy", "obspy.*"]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["Event_*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "pysmo-group",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"pysmo-group" = ["pysmo"]
